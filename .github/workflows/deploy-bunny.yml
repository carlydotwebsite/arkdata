# .github/workflows/deploy-bunny.yml
name: Deploy to Bunny
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Deploy to Bunny.net
        uses: djang0dev/bunnynet-storage-deployer@v0.0.2
        with:
          upload: true
          remove: true
          storageName: ${{ secrets.BUNNY_STORAGE_NAME }}
          storageEndpoint: "storage.bunnycdn.com"
          sourcePattern: "./{assets,thumbs}/**"
          apiKey: ${{ secrets.BUNNY_API_KEY }}
          purgePullZone: true
          pullZoneId: ${{ secrets.BUNNY_PULL_ZONE }}
          verbose: true
