# .github/workflows/deploy-bunny.yml
name: Deploy to Bunny
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Deploy to Bunny.net
        uses: Snider/bunnycdn-gh-action@v2.0.1
        with:
          # target directory to be deployed
          source: "./{assets,thumbs}/**"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          zoneId: 7027344
