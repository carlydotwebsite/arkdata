# .github/workflows/deploy-bunny.yml
name: Deploy to Bunny
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Deploy to Bunny.net
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "assets"
          destination: "assets"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
          purgePullZone: true
      - name: Deploy to Bunny.net
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "thumbs"
          destination: "thumbs"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          storagePassword: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
          purgePullZone: true
