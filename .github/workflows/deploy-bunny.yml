# .github/workflows/deploy-bunny.yml
name: Deploy to Bunny
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: rename files for bnnuy
        run: |
          cd assets/avg/characters
          rename -v -n 's/_(\d{1,2})#(\d{1,2})\$(\d{1,2})/_$1_$2_$3/' avg_*.png
          cd ../../../
      - name: assets/avg/characters
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "assets/avg/characters"
          destination: "assets/avg/characters"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          storagePassword: ${{ secrets.BUNNY_API_KEY }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
      - name: assets/raw/video
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "assets/raw/video"
          destination: "assets/raw/video"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          storagePassword: ${{ secrets.BUNNY_API_KEY }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
      - name: assets/torappu/dynamicassets/avg
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "assets/torappu/dynamicassets/avg"
          destination: "assets/torappu/dynamicassets/avg"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          storagePassword: ${{ secrets.BUNNY_API_KEY }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
      - name: assets/torappu/dynamicassets/sound_beta_2
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "assets/torappu/dynamicassets/sound_beta_2"
          destination: "assets/torappu/dynamicassets/sound_beta_2"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          storagePassword: ${{ secrets.BUNNY_API_KEY }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
      - name: thumbs
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          # target directory to be deployed
          upload: true
          source: "thumbs"
          destination: "thumbs"
          # storage zone name
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          # Storage zone access key
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          storagePassword: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: 7027344
